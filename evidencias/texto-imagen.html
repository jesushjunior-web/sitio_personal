<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto sobre imagen</title><link rel="icon" href="../img/icono.png"><link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header><h1>Texto sobre imagen</h1></header>
    <nav><a href="../portafolio.html">Regresar al portafolio</a></nav>
    <main>
        <h2>Posiciones del texto</h2><p>Colocando texto en distintas posiciones sobre una imagen:</p>
        <div class="contenedor-imagen">
            <img src="../img/mapachihuahua.jpg" alt="Mapa de Chihuahua">
            <div class="topleft">Superior izquierda</div><div class="topright">Superior derecha</div>
            <div class="bottomleft">Inferior izquierda</div><div class="bottomright">Inferior derecha</div>
            <div class="center">Centrado</div>
        </div>
    </main>
</body>
</html>
